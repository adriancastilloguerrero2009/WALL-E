<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/x-icon" href="Coconut Studios.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Wall-E Robot</title>
</head>
<body>
<div class="container">

  <header>
    <h1>// wall-e AI voice model</h1>
    <span class="badge">localhost:3000 (I'm not paying for a domain name)</span>
  </header>


  <!--This is the panel where all the visual information is displayed-->

  <div class="panel">

    <span class="panel-label">01 — Audio Input</span>

    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="audio/*" />
      <div class="hint">drop an audio file or click to browse</div>
      <div class="filename" id="fileName"></div>
    </div>


    <div class="record-row">
      <button id="recordBtn">⏺ record mic</button>
      <span class="rec-timer" id="recTimer"></span>
      <span style="flex:1"></span>
      <button class="primary" id="submitBtn" disabled>run →</button>
    </div>

  </div>

  <!-- Status bar for showing current state of the pipeline -->

  <div class="status-bar">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">idle</span>
  </div>

  <!-- Transcript panel (again another panel)-->

  <div class="panel">
    <span class="panel-label">02 — Transcript (Whisper)</span>
    <div class="output muted" id="transcriptOut">waiting for audio...</div>
  </div>

  <div class="divider"></div>

  <!-- Response panel using Ollama -->

  <div class="panel">
    <span class="panel-label">03 — Response (Ollama)</span>
    <div class="output accent" id="llmOut">waiting for transcript...</div>
  </div>

</div>


<script>

//DOM script to make sure server.ts works properly with the file inputs and the rest of the front-end interface.

  const dropZone     = document.getElementById('dropZone');
  const fileInput    = document.getElementById('fileInput');
  const fileName     = document.getElementById('fileName');
  const recordBtn    = document.getElementById('recordBtn');
  const recTimer     = document.getElementById('recTimer');
  const submitBtn    = document.getElementById('submitBtn');
  const statusDot    = document.getElementById('statusDot');
  const statusText   = document.getElementById('statusText');
  const transcriptEl = document.getElementById('transcriptOut');
  const llmEl        = document.getElementById('llmOut');

  let selectedFile = null, mediaRecorder = null, recordingChunks = [], timerInterval = null, recSeconds = 0;

  function setStatus(msg, state = 'idle') {
    statusText.textContent = msg;
    statusDot.className = 'dot' + (state !== 'idle' ? ' ' + state : '');
  }

  fileInput.addEventListener('change', e => setFile(e.target.files[0]));
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('audio/')) setFile(f);
  });

  function setFile(file) {
    if (!file) return;
    selectedFile = file;
    fileName.textContent = file.name;
    submitBtn.disabled = false;
    setStatus(`ready: ${file.name}`);
  }



//TLDR: Record the damn mic and send the audio file to the back-end (made with glorious typescript)
//The indentation is disgusting and atrocious I know but I try to make it neat and organized, I swear.


  recordBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') { 
      mediaRecorder.stop(); 
      return; 
    }


    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recordingChunks = []; 
      recSeconds = 0;
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => recordingChunks.push(e.data);
      mediaRecorder.onstop = () => {
        clearInterval(timerInterval); 
        recTimer.textContent = '';
        stream.getTracks().forEach(t => t.stop());
        recordBtn.textContent = '⏺ record mic'; 
        recordBtn.classList.remove('recording');
        const blob = new Blob(recordingChunks, { type: 'audio/webm' });
        setFile(new File([blob], 'recording.webm', { type: 'audio/webm' }));
      };


      mediaRecorder.start();
      recordBtn.textContent = '⏹ stop'; 
      recordBtn.classList.add('recording');
      timerInterval = setInterval(() => {
        recSeconds++;
        const m = String(Math.floor(recSeconds / 60)).padStart(2,'0');
        const s = String(recSeconds % 60).padStart(2,'0');
        recTimer.textContent = `${m}:${s}`;
      }, 1000);
    } catch { setStatus('mic access denied', 'error'); }
  });

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    submitBtn.disabled = true;
    transcriptEl.textContent = '';
    transcriptEl.className = 'output';
    llmEl.textContent = '';
    llmEl.className = 'output accent';
    setStatus('uploading...', 'active');

    const form = new FormData();
    form.append('audio', selectedFile);

    try {
      const res = await fetch('/process', { method: 'POST', body: form });
      if (!res.ok || !res.body) throw new Error(`Server error ${res.status}`);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const events = buf.split('\n\n');
        buf = events.pop();

        for (const block of events) {
          const lines = block.split('\n');
          const eventLine = lines.find(l => l.startsWith('event:'));
          const dataLine  = lines.find(l => l.startsWith('data:'));
          if (!eventLine || !dataLine) continue;

          const event = eventLine.replace('event:', '').trim();
          const data  = JSON.parse(dataLine.replace('data:', '').trim());

          if (event === 'status')     setStatus(data.message, 'active');
          if (event === 'transcript') { transcriptEl.textContent = data.transcript; setStatus('generating...', 'active'); }
          if (event === 'token')      llmEl.textContent += data.token;
          if (event === 'done')       setStatus('done ✓', 'done');
          if (event === 'error')      setStatus(data.message, 'error');
        }
      }
    } catch (err) {
      setStatus(String(err), 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });


</script>
</body>
</html>
